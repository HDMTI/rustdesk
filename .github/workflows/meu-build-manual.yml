name: Build Windows Manual
on:
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Clonar RustDesk com submodules
        shell: pwsh
        run: |
          git clone --recurse-submodules https://github.com/rustdesk/rustdesk.git .

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configurar LLVM
        shell: pwsh
        run: |
          $llvmPath = (Get-Command clang).Source | Split-Path
          echo "LIBCLANG_PATH=$llvmPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Instalar vcpkg limpo + opus
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg D:\vcpkg
          D:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          D:\vcpkg\vcpkg.exe install opus:x64-windows-static libvpx:x64-windows-static libyuv:x64-windows-static aom:x64-windows-static --classic
          echo "VCPKG_ROOT=D:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verificar opus instalado
        shell: pwsh
        run: |
          $header = "D:\vcpkg\installed\x64-windows-static\include\opus\opus_multistream.h"
          if (Test-Path $header) {
            Write-Host "OK - opus headers encontrados"
          } else {
            Write-Error "FALHOU - opus_multistream.h não encontrado"
            exit 1
          }

      - name: Cache de dependências
        uses: Swatinem/rust-cache@v2

      - name: Build do RustDesk
        shell: pwsh
        run: cargo build --release
        env:
          VCPKG_ROOT: D:\vcpkg

      - name: Upload do Executável
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-exe
          path: target/release/rustdesk.exe
