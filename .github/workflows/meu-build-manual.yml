name: Build Windows Manual

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependências (vcpkg)
        run: |
          vcpkg install opus:x64-windows-static libvpx:x64-windows-static libyuv:x64-windows-static

      - name: Build do RustDesk
        run: |
          cargo build --release --features inline
        env:
          VCPKG_ROOT: C:\vcpkg
          CMAKE_TOOLCHAIN_FILE: C:\vcpkg\scripts\buildsystems\vcpkg.cmake

      - name: Upload do Executável
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-exe
          path: target/release/rustdesk.exe
