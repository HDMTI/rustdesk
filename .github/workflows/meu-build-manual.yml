name: Build Windows Manual
on:
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar opus via vcpkg
        run: |
          C:\vcpkg\vcpkg.exe install opus:x64-windows-static
        shell: cmd

      - name: Cache de dependências
        uses: Swatinem/rust-cache@v2

      - name: Build do RustDesk
        run: cargo build --release
        env:
          VCPKG_ROOT: C:\vcpkg

      - name: Upload do Executável
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-exe
          path: target/release/rustdesk.exe
