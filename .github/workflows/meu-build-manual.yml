name: Build Windows Manual
on:
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          submodules: recursive   # ← isso estava faltando

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configurar LLVM (já vem no runner)
        shell: pwsh
        run: |
          $llvmPath = (Get-Command clang).Source | Split-Path
          echo "LIBCLANG_PATH=$llvmPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "LLVM encontrado em: $llvmPath"

      - name: Instalar opus no vcpkg do runner
        shell: pwsh
        run: |
          C:\vcpkg\vcpkg.exe install opus:x64-windows-static
          C:\vcpkg\vcpkg.exe integrate install

      - name: Cache de dependências
        uses: Swatinem/rust-cache@v2

      - name: Build do RustDesk
        shell: pwsh
        run: cargo build --release
        env:
          VCPKG_ROOT: C:\vcpkg

      - name: Upload do Executável
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-exe
          path: target/release/rustdesk.exe
