name: Build Windows Manual
on:
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar LLVM (obrigatório para bindgen/magnum-opus)
        shell: pwsh
        run: |
          choco install llvm --version=15.0.2 -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Instalar opus no vcpkg do runner
        shell: pwsh
        run: |
          C:\vcpkg\vcpkg.exe install opus:x64-windows-static
          C:\vcpkg\vcpkg.exe integrate install

      - name: Diagnóstico (opcional, remova depois que funcionar)
        shell: pwsh
        run: |
          Write-Host "=== Pacotes vcpkg instalados ==="
          C:\vcpkg\vcpkg.exe list
          Write-Host "=== Headers opus ==="
          Get-ChildItem "C:\vcpkg\installed\x64-windows-static\include\opus" -ErrorAction SilentlyContinue
          Write-Host "=== LLVM libclang ==="
          Get-Item "C:\Program Files\LLVM\bin\libclang.dll" -ErrorAction SilentlyContinue

      - name: Cache de dependências
        uses: Swatinem/rust-cache@v2

      - name: Build do RustDesk
        shell: pwsh
        run: cargo build --release
        env:
          VCPKG_ROOT: C:\vcpkg
          LIBCLANG_PATH: C:\Program Files\LLVM\bin

      - name: Upload do Executável
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-exe
          path: target/release/rustdesk.exe
